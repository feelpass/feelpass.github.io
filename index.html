<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plantcode Apps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .tagline { color: #666; margin-bottom: 30px; font-size: 16px; }
        .apps { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .app-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .app-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .app-icon { font-size: 36px; }
        .app-info { text-align: left; }
        .app-name { font-weight: 600; color: #333; font-size: 18px; }
        .app-desc { color: #666; font-size: 14px; margin-top: 4px; }
        .contact {
            border-top: 1px solid #eee;
            padding-top: 20px;
            color: #888;
            font-size: 14px;
        }
        .contact a { color: #667eea; text-decoration: none; }
        .contact a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌱</div>
        <h1>plantcode Apps</h1>
        <p class="tagline">생활을 더 편리하게 만드는 앱들</p>
        
        <div class="apps">
            <a href="./promptpal/" class="app-card">
                <span class="app-icon">🤖</span>
                <div class="app-info">
                    <div class="app-name">PromptPal</div>
                    <div class="app-desc">AI 프롬프트 관리 도우미</div>
                </div>
            </a>
            <a href="#" class="app-card">
                <span class="app-icon">📋</span>
                <div class="app-info">
                    <div class="app-name">ClipGenius</div>
                    <div class="app-desc">스마트 클립보드 매니저</div>
                </div>
            </a>
            <a href="#" class="app-card">
                <span class="app-icon">👆</span>
                <div class="app-info">
                    <div class="app-name">OneSwipe</div>
                    <div class="app-desc">원스와이프로 빠른 실행</div>
                </div>
            </a>
            <a href="./type/" class="app-card">
                <img src="./type/images/icon-192.png" alt="type" style="width:36px;height:36px;border-radius:8px;">
                <div class="app-info">
                    <div class="app-name">type</div>
                    <div class="app-desc">스마트 텍스트 단축어 & 액션</div>
                </div>
            </a>
            <a href="./shade/" class="app-card">
                <span class="app-icon">🛡️</span>
                <div class="app-info">
                    <div class="app-name">Shade</div>
                    <div class="app-desc">화면 보호 프라이버시 필터</div>
                </div>
            </a>
            <a href="#" class="app-card">
                <span class="app-icon">⚡</span>
                <div class="app-info">
                    <div class="app-name">Shortcut Pro</div>
                    <div class="app-desc">나만의 단축키 설정</div>
                </div>
            </a>
        </div>
        
        <div class="contact">
            <p>문의: <a href="mailto:philleeran@gmail.com">philleeran@gmail.com</a></p>
        </div>
    </div>
</body>
</html>
